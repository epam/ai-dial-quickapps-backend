services:

  # Local dev OIDC provider, served over HTTPS under a single identity: the hostname below is
  # what the browser uses AND what backend containers use for OIDC discovery, so the issuer
  # Keycloak asserts always equals the address every client was configured with. That matters
  # because upstream chat-api has only one Keycloak knob (AUTH_KEYCLOAK_HOST) and uses it both
  # as the discovery address and as the expected `iss` in its RFC 9207 callback check — unlike
  # DIAL Core, which takes `jwksUrl` and `issuerPattern` separately and can bridge a split.
  #
  # `keycloak.localtest.me` resolves to 127.0.0.1 through public DNS for the browser, and to
  # this container through Docker's internal DNS via the network alias below — so container
  # traffic never leaves the compose bridge network. The certificate is a self-signed local CA
  # (docker_compose_files/keycloak/certs — gitignored, regenerate with generate-certs.sh there);
  # every Node service that talks to Keycloak trusts it via NODE_EXTRA_CA_CERTS.
  #
  # Plain HTTP stays on 8080 (published as 8180) purely as a backchannel for DIAL Core's
  # jwksUrl, which would otherwise need the CA in a Java truststore.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    command: >
      start-dev --import-realm
      --hostname=https://keycloak.localtest.me:8443
      --https-certificate-file=/opt/keycloak/certs/keycloak.crt
      --https-certificate-key-file=/opt/keycloak/certs/keycloak.key
    ports:
      - "8180:8080"
      - "8443:8443"
    networks:
      default:
        aliases:
          - keycloak.localtest.me
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "admin"
    volumes:
      - ./docker_compose_files/keycloak/dial-dev-realm.json:/opt/keycloak/data/import/dial-dev-realm.json:ro
      # Leaf cert and key only — the CA private key sits in the same directory and has no
      # business inside a container.
      - ./docker_compose_files/keycloak/certs/keycloak.crt:/opt/keycloak/certs/keycloak.crt:ro
      - ./docker_compose_files/keycloak/certs/keycloak.key:/opt/keycloak/certs/keycloak.key:ro

  themes:
    image: epam/ai-dial-chat-themes:0.10.0
    ports:
      - "3011:3000"

  chat:
    ports:
      - "3010:3000"
    image: epam/ai-dial-chat:development-0.x
    depends_on:
      - themes
      - core
      - keycloak
    environment:
      NEXTAUTH_SECRET: "secret"
      # Needed now that a real provider is configured below — without it NextAuth infers the
      # callback host from its own listening port (3000) instead of the published one (3010),
      # which would send Keycloak a redirect_uri it never registered.
      NEXTAUTH_URL: "http://localhost:3010"
      THEMES_CONFIG_HOST: "http://themes:8080"
      DIAL_API_HOST: "http://core:8080"
      DIAL_API_KEY: "dial_api_key"
      ENABLED_FEATURES: "voice-input,conversations-section,prompts-section,top-settings,top-clear-conversation,top-chat-info,top-chat-model-settings,empty-chat-settings,header,footer,request-api-key,report-an-issue,likes,conversations-sharing,prompts-sharing,input-files,attachments-manager,conversations-publishing,prompts-publishing,custom-logo,input-links,custom-applications,message-templates,marketplace,code-apps,applications-sharing,marketplace-table-view,edit-last-assistant-message,edit-all-assistant-message,toolsets,dislike-comment,code-interpreter,live-chat-interaction"
      # ENABLED_FEATURES: "conversations-section,prompts-section,top-settings,top-clear-conversation,top-chat-info,top-chat-model-settings,empty-chat-settings,header,footer,request-api-key,report-an-issue,likes,conversations-sharing,prompts-sharing,input-files,attachments-manager,conversations-publishing,prompts-publishing,input-links,custom-applications,message-templates,marketplace,quick-apps,toolsets"
      AUTH_DEBUG_ENABLED: "true"
      PROXY_LANGUAGE_HEADER: "accept-language"
      # Real Keycloak login (dev users: admin-dev/admin-dev, user-dev/user-dev). Without this,
      # authProviders is empty and the app runs fully anonymous (isAuthDisabled=true), which is
      # fine for chat completions but never grants isAdmin / a real user identity.
      AUTH_KEYCLOAK_CLIENT_ID: "dial-local"
      AUTH_KEYCLOAK_SECRET: "dial-local-dev-secret"
      AUTH_KEYCLOAK_HOST: "https://keycloak.localtest.me:8443/realms/dial-dev"
      AUTH_KEYCLOAK_ADMIN_ROLE_NAMES: "admin"
      AUTH_KEYCLOAK_DIAL_ROLES_FIELD: "realm_access.roles"
      NODE_EXTRA_CA_CERTS: "/certs/ca.crt"
    volumes:
      - ./docker_compose_files/keycloak/certs/ca.crt:/certs/ca.crt:ro

  # New NestJS-based chat-api/SPA build, run alongside legacy `chat` above rather than
  # replacing it (see PR #519). Uses the published image: the two workarounds this service
  # used to need a sibling ../ai-dial-chat build for are both moot now that Keycloak is
  # served over HTTPS under one identity — upstream's hardcoded `https://` prefix on
  # AUTH_KEYCLOAK_HOST is now correct, and its `iss`-vs-configured-issuer equality check
  # passes because discovery address and asserted issuer are the same URL.
  chat-new:
    image: epam/ai-dial-chat:development
    ports:
      - "3012:5000"
    # Keycloak's own boot (image build + realm import) can take 20-30s the first time a
    # container starts, longer than chat-new's OIDC discovery retries on its own — restart
    # rather than requiring a manual `docker compose up chat-new` once Keycloak is ready.
    restart: on-failure
    depends_on:
      - themes
      - core
      - keycloak
    environment:
      AUTH_SESSION_SECRET: "48c69bd559cffffb2cbee3951430f324e0cd0c79fd8a83de0a991648cae706c8"
      AUTH_CALLBACK_BASE_URL: "http://localhost:3012"
      AUTH_POST_LOGOUT_REDIRECT_URI: "http://localhost:3012"
      AUTH_COOKIE_SECURE: "false"
      CORS_ORIGIN: "http://localhost:3012"
      DIAL_CORE_URL: "http://core:8080"
      DIAL_API_KEY: "dial_api_key"
      THEMES_CONFIG_URL: "http://themes:8080"
      AUTH_KEYCLOAK_CLIENT_ID: "dial-local"
      AUTH_KEYCLOAK_SECRET: "dial-local-dev-secret"
      # No scheme: upstream prefixes `https://` to build the issuer.
      AUTH_KEYCLOAK_HOST: "keycloak.localtest.me:8443/realms/dial-dev"
      AUTH_KEYCLOAK_ADMIN_ROLE_NAMES: "admin"
      AUTH_KEYCLOAK_DIAL_ROLES_FIELD: "realm_access.roles"
      NODE_EXTRA_CA_CERTS: "/certs/ca.crt"
      # The Settings step embeds the Quick Apps 2.0 configurator as an iframe. chat-api resolves
      # its URL from `dial:applicationTypeEditorUrl` on the Core schema entry, or — for a
      # quickapps2 schema id — from DEV_QUICKAPPS_EDITOR_URL, which wins. Point it at the local
      # `quickapps-frontend` service below; the hosted dev instance cannot be used from here
      # because it sends `frame-ancestors https://chat-ng.aks.dev.dial.parts` and proxies to the
      # dev Core, so it would neither frame nor find locally created apps.
      DEV_QUICKAPPS_EDITOR_URL: "http://localhost:4600"
      # Without the editor's origin here, chat-api's own CSP `frame-src` blocks the iframe.
      ALLOWED_IFRAME_ORIGINS: "http://localhost:4600"
    volumes:
      - ./docker_compose_files/keycloak/certs/ca.crt:/certs/ca.crt:ro

  # Quick Apps 2.0 settings editor (https://github.com/epam/ai-dial-quickapps-frontend) — a
  # standalone Next.js app embedded by chat-new's Settings step over a postMessage protocol.
  # Browser-facing URLs must be the published localhost ones (OIDC redirects and postMessage
  # origin checks run in the browser); server-to-server URLs use compose hostnames.
  quickapps-frontend:
    image: epam/ai-dial-quickapps-frontend:development
    # Published as amd64 only; on Apple Silicon this runs under emulation.
    platform: linux/amd64
    ports:
      - "4600:5000"
    restart: on-failure
    depends_on:
      - themes
      - core
      - keycloak
    environment:
      NEXTAUTH_SECRET: "0e5b1c4f9a2d47e8b3c6f1a894d2e7b5c0a3f6d9e2b5c8a1f4d7e0b3c6a9f2d5"
      # Must match the browser-visible origin — NextAuth builds its callback URL from this.
      NEXTAUTH_URL: "http://localhost:4600"
      AUTH_KEYCLOAK_ISSUER: "https://keycloak.localtest.me:8443/realms/dial-dev"
      AUTH_KEYCLOAK_CLIENT_ID: "dial-local"
      AUTH_KEYCLOAK_CLIENT_SECRET: "dial-local-dev-secret"
      # Server-side proxy target for /api/dial/[...path].
      DIAL_CORE_URL: "http://core:8080"
      # CSP `frame-ancestors` (defaults to 'self', which blocks chat-new) and the origin the
      # editor accepts postMessage from. Both are the chat-new origin as the browser sees it.
      ALLOWED_FRAME_ANCESTORS: "http://localhost:3012"
      ALLOWED_ORIGIN: "http://localhost:3012"
      DIAL_CHAT_URL: "http://localhost:3012"
      # Must point at config.json itself, not the themes base URL.
      THEMES_URL: "http://themes:8080/config.json"
      NODE_EXTRA_CA_CERTS: "/certs/ca.crt"
    volumes:
      - ./docker_compose_files/keycloak/certs/ca.crt:/certs/ca.crt:ro

  redis:
    image: redis:7.4.1-alpine3.20
    restart: always
    mem_limit: 2200M
    command: >
      redis-server --maxmemory 2000mb --maxmemory-policy volatile-lfu --save "" --appendonly no --loglevel warning

  admin-export-init:
    image: busybox:1.37
    volumes:
      - ./docker_compose_files/core/admin-export:/export
    command: >
      sh -c "mkdir -p /export
      && (test -f /export/out.json || echo '{}' > /export/out.json)
      && chmod -R 777 /export"
    restart: "no"

  core:
    ports:
      - "8090:8080"
    image: epam/ai-dial-core:development
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 90s
    environment:
      'AIDIAL_SETTINGS': '/opt/configuration/settings/settings.json'
      'JAVA_OPTS': '-Dgflog.config=/opt/configuration/settings/gflog.xml'
      'LOG_DIR': '/app/log'
      'STORAGE_DIR': '/app/data'
      'AIDIAL_LOG_LEVEL': 'INFO'
      'aidial.config.files': |-
        [
          "/opt/configuration/generated/models.json",
          "/opt/configuration/application-schemas.json",
          "/opt/configuration/applications.json",
          "/opt/configuration/chathub/anthropic.json",
          "/opt/configuration/chathub/gemini.json",
          "/opt/configuration/chathub/openai.json",
          "/opt/configuration/toolsets.json",
          "/opt/admin-export/out.json"
        ]
      'aidial.redis.singleServerConfig.address': 'redis://redis:6379'
    depends_on:
      admin-export-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    volumes:
      - ./docker_compose_files/core/configuration:/opt/configuration
      - ./docker_compose_files/core/admin-export:/opt/admin-export:ro
      - ./docker_compose_files/core/logs/:/app/log
      - ./docker_compose_files/core/data/:/app/data

  adapter-dial:
    image: epam/ai-dial-adapter-dial:development
    environment:
      DIAL_URL: "http://core:8080"
      LOG_LEVEL: "INFO"

  memory:
    ports:
      - "8000:8000"
    image: epam/ai-dial-memory-backend:development
    environment:
      DIAL_URL: "http://core:8080"
      LOG_LEVEL: "INFO"

  # If you want to run Quick Apps in Docker instead of on the host, uncomment the following section and update the quick-apps host in application-schemas.json.
  # quick-apps:
  #   build:
  #       context: .
  #       dockerfile: ./Dockerfile
  #   environment:
  #     DIAL_URL: "http://core:8080"
  #     SHOW_USAGE_STATISTICS: "true"
  #     QUICKAPP_LOG_LEVEL: "DEBUG"

  # DIAL Admin (optional). Enable with: docker compose --profile admin up -d
  # Or set COMPOSE_PROFILES=admin in .env
  admin-backend:
    profiles: ["admin"]
    image: epam/ai-dial-admin-backend:development
    ports:
      - "8092:8080"
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/v1/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 120s
    volumes:
      - admin-backend-data:/app/data
      # Core JSON configs (read-only) — imported into Admin H2 on first startup when DB is empty
      - ./docker_compose_files/core/configuration:/opt/core-config:ro
      # Exported Core config (read/write) — shared with core service at /opt/admin-export/out.json
      - ./docker_compose_files/core/admin-export:/app/data/export
    environment:
      CONFIG_REST_SECURITY_MODE: "none"
      DISABLE_SWAGGER_AUTHORIZATION: "true"
      CORE_CLIENT_URL: "http://core:8080"
      CORE_CONFIG_VERSION: "latest"
      ENABLE_CORE_CONFIG_VERSION_AUTO_DETECT: "true"
      CORE_AUTH_METHOD: "api-key"
      CORE_AUTH_API_KEY_VALUE: "dial_api_key"
      ENABLE_CONFIG_AUTO_IMPORT_ON_BOOTSTRAP: "true"
      IMPORT_AUTO_BOOTSTRAP_FILE_PATHS: "/opt/core-config/applications.json,/opt/core-config/application-schemas.json,/opt/core-config/toolsets.json,/opt/core-config/chathub/anthropic.json,/opt/core-config/chathub/gemini.json,/opt/core-config/chathub/openai.json,/opt/core-config/generated/models.json"
      IMPORT_AUTO_BOOTSTRAP_STRATEGY: "MERGE_JSON"
      CONFIG_EXPORT_ENABLED: "true"
      CONFIG_EXPORT_STORAGETYPE: "LOCAL_FILE"
      CONFIG_EXPORT_OUTPUTFILE_PATH: "data/export/out.json"
      ENABLE_CONFIG_RELOAD: "true"
      OTEL_SDK_DISABLED: "true"
      METRICS_ENABLED: "false"
      H2_FILE: "./data/testdb"
      H2_DATASOURCE_PASSWORD: "password"
      H2_DATASOURCE_MASTER_KEY: "t8+npcgNMiipR+kHMb8zXAjgA3IedCXC"
      H2_DATASOURCE_ENCRYPTED_FILE_KEY: "9vW1l/Eg+1J3YXpCsyR6AUI4ptMtI6pjkktePuUQts+wKVAauoP5CG21z5WTzp91xBcEww=="

  admin-frontend:
    profiles: ["admin"]
    image: epam/ai-dial-admin-frontend:development
    ports:
      - "3020:3000"
    depends_on:
      admin-backend:
        condition: service_healthy
      core:
        condition: service_healthy
      themes:
        condition: service_started
      keycloak:
        condition: service_started
    environment:
      DIAL_ADMIN_API_URL: "http://admin-backend:8080/"
      NEXTAUTH_SECRET: "secret"
      # NEXTAUTH_URL enables NextAuth middleware (get-auth-toggle.ts). It used to be left unset
      # because with no AUTH_* providers that yields an empty /api/auth/signin page; now that
      # Keycloak is configured below, a real login works, and DIAL_CORE_API_URL below unblocks
      # Skills/Publications, which call DIAL Core directly forwarding the user's JWT.
      NEXTAUTH_URL: "http://localhost:3020"
      DIAL_CORE_API_URL: "http://core:8080"
      THEMES_CONFIG_URL: "http://themes:8080"
      DIAL_LINK: "http://localhost:3010"
      DEPLOYMENTS_ENABLED: "true"
      MCP_REGISTRY_ENABLED: "false"
      NIM_ENABLED: "false"
      HF_ENABLED: "false"
      AUTH_KEYCLOAK_CLIENT_ID: "dial-local"
      AUTH_KEYCLOAK_SECRET: "dial-local-dev-secret"
      AUTH_KEYCLOAK_HOST: "https://keycloak.localtest.me:8443/realms/dial-dev"
      AUTH_KEYCLOAK_ADMIN_ROLE_NAMES: "admin"
      AUTH_KEYCLOAK_DIAL_ROLES_FIELD: "realm_access.roles"
      NODE_EXTRA_CA_CERTS: "/certs/ca.crt"
    volumes:
      - ./docker_compose_files/keycloak/certs/ca.crt:/certs/ca.crt:ro

volumes:
  admin-backend-data:
