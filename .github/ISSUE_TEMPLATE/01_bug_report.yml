name: 🐞 Bug report
description: Create a report to help us improve
type: Bug
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue to improve DIAL.
        Please fill in as much of the following form as you're able.
  - type: input
    attributes:
      label: QuickApps version
      description: Application version
      placeholder: latest
      value: latest
    validations:
      required: true
  - type: textarea
    attributes:
      label: What steps will reproduce the bug?
      description: >
        Enter details about your bug. For bugs related to orchestrator model, include the model name and version.
        For bugs related to toolsets or subagents, include details on toolset/subagent configuration.
      placeholder: |
        1. In this environment...
        2. With this config...
        3. Run '...'
        4. See error...
    validations:
      required: true
  - type: textarea
    attributes:
      label: What is the expected behavior?
      description: If possible please provide textual output instead of screenshots.
  - type: textarea
    attributes:
      label: What do you see instead?
      description: If possible please provide textual output instead of screenshots.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional information
      description: Tell us anything else you think we should know.
