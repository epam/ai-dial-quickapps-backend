name: PR Workflow

env:
  POETRY: ${{ vars.POETRY }}
  PYTHON: ${{ vars.PYTHON }}

on:
  pull_request:
    branches: [development, release-*]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  run_tests:
    uses: epam/ai-dial-ci/.github/workflows/python_docker_pr.yml@3.1.3
    secrets: inherit
    with:
      python-version: "3.13"
      poetry-version: "2.2.1"
