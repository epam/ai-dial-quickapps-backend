name: Generate Schema

on:
  push:
    branches:
      - feat/add-app-schema

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate-schema:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          lfs: true
      - uses: epam/ai-dial-ci/actions/python_prepare@3.0.0
        with:
          python-version: 3.13
          poetry-version: 2.1.1

      - name: Generate schema
        run: |
          make init_venv
          source .venv/bin/activate
          make install_dev
          make dump_app_schema
      
      - name: Commit and push schema
        run: |
          git config --global user.name "ai-dial-actions"
          git config --global user.email "149404362+ai-dial-actions@users.noreply.github.com"
          git add generated-app-schema.json
          git commit -m "chore: update generated app schema"
          git push