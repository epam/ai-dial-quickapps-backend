[project]
name = "QuickApps"
version = "0.0.0"
description = "Configurable agentic application for DIAL"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
authors = [
    {name = "EPAM Systems"}
]
dependencies = [
    # Core framework & DI
    "aidial-client>=0.7.0,<0.8.0",                # DIAL API client
    "aidial-sdk[telemetry]>=0.32.0,<0.33.0",      # DIAL integration SDK
    "pydantic>=2.12.4,<3.0.0",                    # Data validation
    "pydantic-settings>=2.12.0,<3.0.0",           # Settings management
    "injector>=0.23.0,<0.24.0",                   # Dependency injection
    "fastapi-injector>=0.9.0,<0.10.0",            # FastAPI + injector integration

    # Data processing & visualization
    "pandas>=2.3.3,<3.0.0",                       # Data manipulation
    "tabulate>=0.9.0,<0.10.0",                    # Table formatting
    "plotly>=6.5.2,<7.0.0",                       # Data visualization

    # MCP (Model Context Protocol)
    "mcp>=1.23.2,<2.0.0",                         # MCP protocol support
    "fastmcp>=3.2.0,<4.0.0",                      # High-level MCP server framework

    # HTML & web content
    "beautifulsoup4>=4.14.2,<5.0.0",              # HTML parsing
    "bs4>=0.0.2,<0.0.3",                          # BeautifulSoup4 meta-package

    # Authentication & networking
    "authlib>=1.6.11,<2.0.0",                      # OAuth / JWT authentication
    "urllib3>=2.6.3,<3.0.0",                      # HTTP client library

    # Utilities
    "common>=0.1.2,<0.2.0",                       # Shared utilities
    "pyyaml (>=6.0.2,<7.0.0)",                    # YAML parsing
]
homepage = "https://dialx.ai"
repository = "https://github.com/epam/ai-dial-quickapps-backend"
keywords = ["ai"]

[tool.poetry]
package-mode = false
requires-poetry = '>=2.0.0,<3.0.0'

[tool.poetry.group.dev.dependencies]
black = { version = "^26.3.1", extras = ["jupyter"] }
isort = "^5.13.2"
mypy = "^1.19.1"
types-requests = "^2.31.0.20240406"
pre-commit = "^3.8.0"
flake8 = "^7.3.0"
autoflake = "^2.3.1"
pyright = "^1.1.394"
pandas-stubs = "^3.0.0.260204"
types-authlib = "^1.6.8.20260215"
plotly-stubs = "^0.1.2"
types-pyyaml = ">=6.0.12"

[tool.poetry.group.test.dependencies]
pytest = "^9.0.2"
parameterized = "^0.9.0"
pytest-asyncio = "^1.3.0"
pytest-xdist = "^3.8.0"
pytest-cov = "^7.0.0"
pytest-env = "^1.6.0"
pytest-httpx = ">=0.35.0,<0.37.0"

[tool.poetry.group.integration]
optional = true

[tool.poetry.group.integration.dependencies]
pytest = "^9.0.2"
sentence-transformers = { version = "^3.4.1" }
pytest-asyncio = "^1.3.0"
pytest-xdist = "^3.8.0"
pytest-cov = "^7.0.0"
pytest-env = "^1.6.0"

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src"]
extend_skip_glob = ["src/**/__init__.py"]

[tool.black]
line-length = 100
skip-string-normalization = true
target-version = ["py313"]
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  # The following are specific to Black, you probably don't want those.
  | blib2to3
  | tests/data
  | profiling
)/
'''

[tool.pyright]
typeCheckingMode = "basic"
reportIncompatibleMethodOverride = "error"
reportUnusedVariable = "error"

exclude = [
    ".git",
    ".venv",
    ".nox",
    "**/__pycache__",
    "**/.pytest_cache"
]

[tool.autoflake]
ignore_init_module_imports = true
remove_all_unused_imports = true
in_place = true
recursive = true
quiet = true
exclude = [
    '\.git',
    '\.venv',
    '\.nox',
    '\.pytest_cache',
    '__pycache__'
]

[tool.mypy]
plugins = ["pydantic.mypy"]
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["aidial_sdk.*", "aidial_client.*"]
follow_untyped_imports = true

[tool.poetry.group.dev]
optional = true

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
env_files = [".env"]
asyncio_default_fixture_loop_scope = "session"
addopts = "-ra"
markers = [
    "integration: integration tests, that require LLM calls and cached LLM Tool calls (deselect with '-m \"not integration\"')",
    "e2e: e2e tests, that require LLM calls without using cached responses (deselect with '-m \"not e2e\"')"
]

[tool.pytest_env]
env_files = [".env"]
